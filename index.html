<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健身记录">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="本地健身记录：力量训练逐组记录、有氧热量估算、训练容量与进步曲线">
<title>我的健身记录</title>
<style>
:root{
  --bg:#0d0f14; --card:#171b23; --card2:#1e232e; --line:#272d3a; --line2:#323a4b;
  --accent:#ff7a1a; --accent2:#ffa040; --accent-soft:rgba(255,122,26,.14);
  --green:#2dd47a; --green-soft:rgba(45,212,122,.13);
  --blue:#4ea8ff; --red:#ff5d5d;
  --text:#f2f4f8; --sub:#98a1b3; --dim:#5f6a7d;
  --radius:14px; --shadow:0 8px 24px rgba(0,0,0,.35);
  --scheme:dark;
}
html[data-theme="light"]{
  --bg:#f5f6f8; --card:#ffffff; --card2:#f0f2f6; --line:#e2e6ee; --line2:#d3d9e4;
  --accent:#ef6a00; --accent2:#c85a00; --accent-soft:rgba(239,106,0,.12);
  --green:#12a05d; --green-soft:rgba(18,160,93,.12);
  --blue:#1a7fd4; --red:#e03b3b;
  --text:#1a1f2b; --sub:#5d6778; --dim:#8a93a5;
  --shadow:0 6px 20px rgba(20,26,40,.10);
  --scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); color-scheme:var(--scheme);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.5; overflow:hidden;
}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
::-webkit-scrollbar{display:none}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 图标 ===== */
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.14em;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#sprite{display:none}

/* ===== 顶栏 ===== */
.topbar{
  padding:16px 18px 10px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.app-title{font-size:19px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.app-title .ico{font-size:21px;color:var(--accent2)}
.today{font-size:12px;color:var(--sub);margin-top:3px}
.kcal-badge{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:16px; padding:8px 15px; text-align:center; box-shadow:0 6px 18px rgba(255,122,26,.3); color:#fff;
}
.kcal-num{font-size:20px;font-weight:800;line-height:1.1}
.kcal-unit{font-size:11px;font-weight:600;margin-left:3px}
.kcal-label{font-size:10px;opacity:.9;margin-top:1px}

/* ===== 页面容器 ===== */
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 120px;display:none;-webkit-overflow-scrolling:touch}
.page.active{display:block}
.page-title{font-size:16px;font-weight:700;margin:8px 2px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.page-title small{color:var(--dim);font-weight:400;font-size:11px}
.section-head{font-size:12.5px;font-weight:700;color:var(--sub);margin:18px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ===== 搜索 ===== */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:0 12px;margin-bottom:10px}
.search-bar .ico{font-size:17px;color:var(--dim)}
.search-bar input{flex:1;background:none;border:none;outline:none;padding:11px 0;font-size:14px;-webkit-appearance:none;appearance:none}
.search-bar input::-webkit-search-cancel-button{display:none}
.search-bar input::placeholder{color:var(--dim)}
.search-clear{color:var(--dim);font-size:16px;padding:4px;display:none}
.search-bar.has-val .search-clear{display:block}

/* ===== 日期条 ===== */
.date-bar{display:flex;align-items:center;gap:8px;padding:2px 2px 10px}
.db-date{font-size:13px;font-weight:700;color:var(--sub);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.db-date .ico{font-size:15px}
.db-input{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12.5px;color:var(--text);max-width:144px}
.db-today{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12px;color:var(--accent2);font-weight:700;white-space:nowrap}
.past-banner{display:none;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid var(--accent);
  color:var(--accent2);border-radius:11px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:10px}
.past-banner.show{display:flex}
.past-banner .ico{font-size:16px}

/* ===== 分类 chips ===== */
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chip{
  flex-shrink:0; display:flex; align-items:center; gap:6px;
  background:var(--card); border:1px solid var(--line); color:var(--sub);
  padding:9px 14px; border-radius:999px; font-size:13.5px; font-weight:600; transition:all .18s;
}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent2)}
.chip .ico{font-size:16px}

/* ===== 动作网格 ===== */
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:4px}
.act-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 5px 11px; display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:transform .12s, border-color .18s; min-height:96px; justify-content:center;
}
.act-card:active{transform:scale(.96);border-color:var(--accent)}
.act-card .ico{font-size:25px;color:var(--accent2)}
.act-name{font-size:12px;font-weight:600;text-align:center;color:var(--text);line-height:1.3}
.act-tag{font-size:9.5px;color:var(--dim)}
.act-card .last-dot{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.add-card{border-style:dashed;color:var(--sub)}
.add-card .ico{color:var(--sub)}
.grid-empty{grid-column:1/-1;text-align:center;color:var(--dim);font-size:13px;padding:30px 0}

/* ===== 今日已记录 ===== */
.today-list{margin-top:6px}

/* ===== 底部 Tab ===== */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50; max-width:520px; margin:0 auto;
  display:flex; background:var(--bg); background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding:7px 6px calc(7px + env(safe-area-inset-bottom));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--dim);font-size:10.5px;font-weight:600;border-radius:10px;transition:color .18s}
.tab .ico{font-size:21px;transition:transform .18s}
.tab.active{color:var(--accent2)}
.tab.active .ico{transform:translateY(-1px)}

/* ===== 休息计时浮条 ===== */
.rest-bar{
  position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:120;
  max-width:496px;margin:0 auto;background:var(--card);border:1px solid var(--accent);
  border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:var(--shadow);
}
.rest-bar.show{display:flex}
.rest-bar.done{border-color:var(--green)}
.rest-ring{width:40px;height:40px;flex:none;position:relative}
.rest-ring svg{width:40px;height:40px;transform:rotate(-90deg)}
.rest-ring circle{fill:none;stroke-width:3.5}
.rest-ring .bgc{stroke:var(--card2)}
.rest-ring .fgc{stroke:var(--accent2);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.rest-bar.done .fgc{stroke:var(--green)}
.rest-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.rest-txt{flex:1;min-width:0}
.rest-txt .t1{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-txt .t2{font-size:11px;color:var(--sub);margin-top:1px}
.rest-btn{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;color:var(--accent2);white-space:nowrap}

/* ===== 抽屉 ===== */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:100;max-width:520px;margin:0 auto;
  background:var(--card); border-radius:22px 22px 0 0; border-top:1px solid var(--line);
  transform:translateY(105%); transition:transform .3s cubic-bezier(.2,.8,.25,1);
  max-height:92vh; max-height:92dvh; display:flex; flex-direction:column;
}
.drawer.show{transform:translateY(0)}
.drag-handle{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:10px auto 4px}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 18px 12px}
.drawer-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.drawer-title .ico{font-size:20px;color:var(--accent2)}
.drawer-sub{font-size:12px;color:var(--sub);margin-top:3px}
.drawer-close{width:30px;height:30px;border-radius:50%;background:var(--card2);color:var(--sub);font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.drawer-body{flex:1;overflow-y:auto;padding:2px 18px calc(18px + env(safe-area-inset-bottom))}

/* 表单 */
.field{margin-bottom:16px}
.field-label{font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.field-label .hint{font-weight:400;font-size:11px;color:var(--dim);text-align:right}
.stepper{display:flex;align-items:center;background:var(--card2);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.step-btn{width:46px;height:44px;font-size:20px;font-weight:700;color:var(--accent2);display:flex;align-items:center;justify-content:center;transition:background .15s}
.step-btn:active{background:var(--accent-soft)}
.step-val{flex:1;text-align:center;font-size:17px;font-weight:800}
.step-val small{font-size:11px;font-weight:500;color:var(--dim);margin-left:3px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;border:1px solid var(--line);gap:4px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub);transition:all .15s;white-space:nowrap}
.seg button.on{background:var(--accent-soft);color:var(--accent2)}
.seg.green button.on{background:var(--green-soft);color:var(--green)}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:0 0 calc(33.33% - 4px);padding:8px 0;font-size:12px}
input.num,input.txt{
  width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:16px;font-weight:700;outline:none;transition:border-color .15s;
}
input.num:focus,input.txt:focus{border-color:var(--accent)}
input.txt{font-weight:600;font-size:15px}

/* 组表格 */
.sets-box{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px}
.set-row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.set-no{width:26px;height:30px;flex:none;border-radius:8px;background:var(--card);color:var(--sub);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.set-row.done .set-no{background:var(--green-soft);color:var(--green)}
.set-in{flex:1;min-width:0;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:0 9px}
.set-in input{width:100%;background:none;border:none;outline:none;padding:8px 0;font-size:15px;font-weight:700;text-align:right;-moz-appearance:textfield}
.set-in input::-webkit-outer-spin-button,.set-in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set-in span{font-size:11px;color:var(--dim);margin-left:4px;flex:none}
.set-in:focus-within{border-color:var(--accent)}
.set-x{font-size:12px;color:var(--dim);flex:none}
.set-act{width:30px;height:30px;flex:none;border-radius:8px;background:var(--card);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:14px}
.set-act.on{color:var(--green);background:var(--green-soft)}
.set-act .ico{font-size:15px}
.sets-tools{display:flex;gap:8px;margin-top:10px}
.sets-tools button{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 0;font-size:12.5px;font-weight:700;color:var(--accent2);display:flex;align-items:center;justify-content:center;gap:5px}
.sets-tools button.sub{color:var(--sub)}
.sets-sum{font-size:11.5px;color:var(--sub);text-align:center;padding:4px 0 2px}
.sets-sum b{color:var(--accent2)}

/* 上次记录 */
.last-box{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin-bottom:14px}
.last-box .lb-txt{flex:1;min-width:0;font-size:12px;color:var(--sub);line-height:1.6}
.last-box .lb-txt b{color:var(--text);font-weight:700}
.last-box .lb-sets{color:var(--accent2);font-weight:700}
.last-box .mini-btn{flex:none}
.pr-flag{display:inline-flex;align-items:center;gap:3px;color:var(--green);font-weight:700;font-size:11px}

/* 热量预估 */
.kcal-preview{
  margin:4px 0 16px;background:linear-gradient(135deg,var(--green-soft),var(--accent-soft));
  border:1px solid var(--line);border-color:color-mix(in srgb, var(--green) 32%, transparent);border-radius:16px;padding:13px 15px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.kcal-preview .kv .k{font-size:11px;color:var(--sub)}
.kcal-preview .kv .v{font-size:22px;font-weight:800;color:var(--green)}
.kcal-preview .note{font-size:11px;color:var(--dim);text-align:right;line-height:1.6}
.btn-save{
  width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 20px rgba(255,122,26,.3);transition:transform .12s,opacity .15s;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.btn-save:active{transform:scale(.98);opacity:.9}
.btn-save.secondary{background:var(--card2);color:var(--sub);box-shadow:none;border:1px solid var(--line);font-weight:700}
.btn-save.danger{background:var(--card2);color:var(--red);box-shadow:none;border:1px solid var(--line)}
.btn-pair{display:flex;gap:10px}
.btn-pair .btn-save{flex:1;font-size:14px;padding:13px}

/* 参考重量 */
.ref-box{background:var(--card2);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px;color:var(--sub);line-height:1.85}
.ref-box>b{color:var(--text)}
.ref-row{display:flex;gap:10px;align-items:center;color:var(--sub)}
.ref-row .rl{width:50px;font-weight:700;color:var(--text);flex:none}
.ref-row .rm{margin-left:auto;color:var(--dim);font-size:11px}
.ref-row.on{color:var(--accent2);font-weight:700}
.ref-row.on .rl{color:var(--accent2)}
.ref-note{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2);color:var(--dim);font-size:11px;line-height:1.6}

/* ===== 历史页 ===== */
.month-head{font-size:12px;font-weight:800;color:var(--dim);margin:16px 2px 8px;letter-spacing:.5px}
.day-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin-bottom:12px}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.day-date{font-size:15px;font-weight:800}
.day-meta{font-size:11px;color:var(--dim);font-weight:500;margin-top:3px}
.day-right{text-align:right;flex:none}
.day-kcal{font-size:13px;font-weight:800;color:var(--green)}
.day-tools{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.day-tools button{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--sub)}
.hist-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;
  padding:9px 10px;background:var(--card2);border-radius:10px;margin-bottom:7px;font-size:13px;
}
.hist-item:last-child{margin-bottom:0}
.hi-main{min-width:0;flex:1}
.hi-name{font-weight:700;display:flex;align-items:center;gap:6px}
.hi-name .ico{font-size:16px;color:var(--accent2)}
.hi-time{font-size:10.5px;color:var(--dim);font-weight:500}
.hi-detail{color:var(--sub);font-size:11.5px;margin-top:3px;line-height:1.5;word-break:break-word}
.hi-right{display:flex;align-items:center;gap:4px;flex:none}
.hi-kcal{color:var(--green);font-weight:700;font-size:12.5px;white-space:nowrap}
.hi-del{color:var(--dim);padding:6px;border-radius:8px;display:flex}
.hi-del .ico{font-size:15px}
.hi-del:active{background:var(--red);color:#fff}
.empty{text-align:center;color:var(--dim);padding:48px 0;font-size:13.5px;line-height:1.9}
.empty .ico{font-size:40px;opacity:.45;display:block;margin:0 auto 12px}
.load-more{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:10px}

/* ===== 统计页 ===== */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 12px}
.stat-card .n{font-size:20px;font-weight:800;color:var(--accent2);line-height:1.2}
.stat-card .n.g{color:var(--green)}
.stat-card .l{font-size:11px;color:var(--sub);margin-top:3px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:14px}
.chart-card .t{font-size:13px;font-weight:700;color:var(--sub)}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.chart-head .t{margin:0}
.seg.mini{padding:3px;border-radius:10px;flex:none}
.seg.mini button{padding:5px 9px;border-radius:7px;font-size:11.5px;flex:none}
.mini-btn{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--accent2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.mini-btn:active{opacity:.7}
.bars{display:flex;align-items:flex-end;gap:5px;height:118px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.bar{width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--accent2),var(--accent));min-height:3px;transition:height .4s}
.bar.zero{background:var(--card2)}
.bar-label{font-size:9.5px;color:var(--dim);white-space:nowrap}
.bar-val{font-size:9.5px;color:var(--green);font-weight:700;white-space:nowrap}
.part-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.part-row .pn{width:62px;font-size:12.5px;color:var(--sub);flex:none;text-align:right}
.part-bar{flex:1;height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.part-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.part-row .pv{width:46px;font-size:11.5px;font-weight:700;color:var(--accent2);text-align:right}
.balance-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card2);border-radius:10px;margin-bottom:7px;font-size:12.5px}
.balance-row .bn{font-weight:700;width:62px;flex:none}
.balance-row .bd{flex:1;color:var(--sub);font-size:11.5px}
.balance-row .bt{font-weight:700;font-size:12px}
.balance-row .bt.ok{color:var(--green)}
.balance-row .bt.warn{color:var(--accent2)}
.balance-row .bt.bad{color:var(--red)}
.pr-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card2);border-radius:10px;margin-bottom:7px;font-size:13px}
.pr-row .ico{font-size:16px;color:var(--accent2);flex:none}
.pr-row .pn{flex:1;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-row .pv{font-weight:800;color:var(--accent2);white-space:nowrap}
.pr-row .pd{font-size:10.5px;color:var(--dim);white-space:nowrap}
.pick-wrap{position:relative}
select.pick{appearance:none;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:9px 30px 9px 12px;font-size:13px;font-weight:700;outline:none}
.pick-wrap .ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--dim);font-size:16px}
.streak-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.streak-card .ico{font-size:28px;color:var(--accent)}
.streak-n{font-size:22px;font-weight:800;color:var(--accent2);line-height:1.1}
.streak-l{font-size:11.5px;color:var(--sub);margin-top:2px}
.dots-week{display:flex;gap:4px;margin-left:auto}
.dots-week i{width:9px;height:9px;border-radius:50%;background:var(--card2);display:block}
.dots-week i.on{background:var(--green)}

/* ===== 我的页 ===== */
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:14px}
.form-card>.t{font-size:14px;font-weight:800;margin-bottom:13px;display:flex;align-items:center;gap:7px}
.form-card>.t .ico{font-size:18px;color:var(--accent2)}
.form-card>.t small{color:var(--dim);font-weight:500;font-size:11px;margin-left:auto}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row.one{grid-template-columns:1fr}
.form-item label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:6px;font-weight:600}
.note-line{font-size:11.5px;color:var(--sub);margin-top:8px;padding:9px 11px;background:var(--card2);border-radius:10px;line-height:1.7}
.note-line b{color:var(--accent2)}
.btn-row{display:flex;gap:10px;margin-top:8px}
.btn-row .btn-save{flex:1;padding:12px;font-size:14px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;background:var(--card2);border-radius:10px;margin-bottom:8px;font-size:13px}
.list-item .li-name{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.list-item .li-name .ico{font-size:17px;color:var(--accent2);flex:none}
.list-item .li-name small{color:var(--dim);font-weight:500;font-size:11px}
.li-acts{display:flex;gap:4px;flex:none}
.li-acts button{color:var(--dim);padding:5px;border-radius:7px;display:flex}
.li-acts button .ico{font-size:15px}
.li-acts button.del:active{background:var(--red);color:#fff}
.menu-btn{width:100%;text-align:left;padding:13px 14px;background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--text)}
.menu-btn:active{background:var(--line)}
.menu-btn small{color:var(--dim);font-weight:500;font-size:11.5px;text-align:right}
.about-note{text-align:center;color:var(--dim);font-size:11px;padding:6px 0 4px;line-height:1.8}
.icon-pick{display:flex;flex-wrap:wrap;gap:7px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px;max-height:150px;overflow-y:auto}
.icon-pick button{width:38px;height:38px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.icon-pick button .ico{font-size:21px}
.icon-pick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent2)}
.w-item{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--card2);border-radius:10px;margin-bottom:7px;font-size:13px}
.w-date{font-size:12px;color:var(--sub);flex:1}
.w-val{font-weight:800}
.w-diff{font-size:12px;font-weight:700;width:52px;text-align:right}
.w-diff.up{color:var(--red)}
.w-diff.down{color:var(--green)}
.w-diff0{color:var(--dim)}
.backup-warn{display:flex;align-items:center;gap:9px;background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:11px;padding:10px 12px;font-size:12px;color:var(--accent2);font-weight:600;margin-bottom:10px;line-height:1.5}
.backup-warn .ico{font-size:17px;flex:none}

/* ===== Toast ===== */
#toast{
  position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--card);color:var(--text);padding:10px 14px;border-radius:999px;
  font-size:13.5px;font-weight:600;border:1px solid var(--line2);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:88%;
  display:flex;align-items:center;gap:10px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast .undo{background:var(--accent-soft);color:var(--accent2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;flex:none;display:none}
#toast.has-undo .undo{display:block}

/* ===== 弹层 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:calc(100% - 56px);max-width:340px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-height:80vh;overflow-y:auto}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-title{font-size:16px;font-weight:800;margin-bottom:14px;text-align:center}
.modal-row{display:flex;gap:10px;margin-top:16px}
.modal-row .btn-save{flex:1;padding:12px;font-size:14px}
.modal-text{font-size:13px;color:var(--sub);line-height:1.8;margin-bottom:4px}
</style>
</head>

<script>
"use strict";
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad2 = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, d) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };

function dateKey(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr(){ return dateKey(new Date()); }
function parseDate(iso){ const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function daysBetween(a, b){ return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
function shiftDate(iso, n){ const d = parseDate(iso); d.setDate(d.getDate() + n); return dateKey(d); }
function fmtDate(iso){
  const dt = parseDate(iso);
  const wk = ['日', '一', '二', '三', '四', '五', '六'][dt.getDay()];
  return `${dt.getMonth() + 1}月${dt.getDate()}日 周${wk}`;
}
function fmtDateShort(iso){ const dt = parseDate(iso); return `${dt.getMonth() + 1}/${dt.getDate()}`; }
function relDay(iso){
  const n = daysBetween(iso, todayStr());
  if (n === 0) return '今天';
  if (n === 1) return '昨天';
  if (n === 2) return '前天';
  return n > 0 ? `${n}天前` : `${-n}天后`;
}
function fmtHM(min){
  min = Math.round(min);
  if (min < 60) return min + '分钟';
  const h = Math.floor(min / 60), m = min % 60;
  return h + '小时' + (m ? ' ' + m + '分' : '');
}
function fmtMMSS(s){ s = Math.max(0, Math.round(s)); return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); }
function fmtKg(v){ return (Math.round(v * 10) / 10).toString(); }
function fmtVol(v){ return v >= 10000 ? (v / 1000).toFixed(1) + 't' : Math.round(v) + 'kg'; }
function ico(name, cls){ return `<svg class="ico ${cls || ''}" aria-hidden="true"><use href="#i-${name}"></use></svg>`; }

/* ================= 分类 ================= */
const CATS = [
  { id: 'chest',    name: '胸部',     ico: 'bench' },
  { id: 'back',     name: '背部',     ico: 'pulldown' },
  { id: 'shoulder', name: '肩部',     ico: 'press' },
  { id: 'arm',      name: '手臂',     ico: 'curl' },
  { id: 'leg',      name: '腿部',     ico: 'squat' },
  { id: 'glute',    name: '臀部',     ico: 'hipthrust' },
  { id: 'core',     name: '腹部核心', ico: 'crunch' },
  { id: 'full',     name: '全身',     ico: 'burpee' },
  { id: 'cardio',   name: '有氧',     ico: 'run' },
];
const catName = id => (CATS.find(c => c.id === id) || { name: id || '其他' }).name;

/* 负重方式：bar=器械/杠铃总重  db=哑铃单只  machine=配重片  cable=绳索配重  kb=壶铃  bw=自重 */
const LOAD_TXT = { bar: '杠铃总重（含杆）', db: '单只哑铃重量', machine: '配重片重量', cable: '绳索配重', kb: '壶铃重量', bw: '自重（额外负重填重量栏）', smith: '史密斯片重', band: '弹力带等效重量', other: '重量' };

/* 动作库：c = 参考重量系数（×体重 ≈ 可做6-8次的重量），0 表示自重 */
const BUILTIN = [
  /* ===== 胸部 ===== */
  { id:'b_chest_1',  cat:'chest', name:'杠铃卧推',      ico:'bench',    c:1.00, met:5.0, compound:1, load:'bar' },
  { id:'b_chest_3',  cat:'chest', name:'上斜杠铃卧推',  ico:'incline',  c:0.80, met:4.8, compound:1, load:'bar' },
  { id:'b_chest_4',  cat:'chest', name:'下斜杠铃卧推',  ico:'decline',  c:0.95, met:4.6, compound:1, load:'bar' },
  { id:'b_chest_14', cat:'chest', name:'史密斯卧推',    ico:'smith',    c:0.90, met:4.8, compound:1, load:'bar' },

ame":"体侧屈","tier":"core","rom":0.35,"aliases":["侧屈","体侧弯","side bend"],"loads":{"db":0.2,"cable":0.25},"ico":"twist"},{"id":"turkish_getup","name":"土耳其起立","tier":"full","rom":1.2,"aliases":["turkish get up","tgu","起立"],"loads":{"kb":0.2,"db":0.2},"bw":0.6,"ico":"kettlebell"}]};

function interpMet(table, x){
  if (x <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++){
    if (x <= table[i][0]){
      const a = table[i-1], b = table[i];
      return a[1] + (b[1]-a[1]) * (x-a[0]) / (b[0]-a[0]);
    }
  }
  return table[table.length-1][1];
}
const walkMet = v => interpMet(EXERCISE_KB.metTables.WALK, v);
const runMet  = v => interpMet(EXERCISE_KB.metTables.RUN, v);
/* 水平分量用实测表，垂直分量用 ACSM 的 1.8×(m/min)×坡度 —— 原来的 slope*0.7 不随速度变化 */
const inclineMet = (slope, v) => {
  const vv = v || 5.0;
  return interpMet(EXERCISE_KB.metTables.WALK, vv)
       + 1.8 * (vv * 1000 / 60) * ((slope || 0) / 100) / 3.5;
};
function wattMet(watts, kg){ return (10.8 * watts / (kg || 70) + 7) / 3.5; }

/* Mifflin-St Jeor 基础代谢 */
function bmrOf(p){
  const w = p.weight || 70, h = p.height || 175, a = p.age || 25;
  return 10 * w + 6.25 * h - 5 * a + (p.gender === 'female' ? -161 : 5);
}
const rmrMin = p => bmrOf(p) / 1440;
const netKcalOf   = (met, kg, min) => Math.max(0, met - 1) * (kg || 70) * 0.0175 * min;
const grossKcalOf = (met, p, min)  => netKcalOf(met, p.weight, min) + rmrMin(p) * min;
/* 旧版公式，只保留给历史数据迁移用 */
function calcKcal(met, kg, minutes, net){
  if (!met || !kg || !minutes) return 0;
  return Math.max(0, (net ? met - 1 : met)) * kg * (minutes / 60) * 1.05;
}
/* Keytel 2005：由平均心率推算运动期间总消耗（仅有氧稳态可靠） */
function keytelKcalMin(hr, p){
  if (!hr || hr < 90) return null;
  const k = EXERCISE_KB.keytel[p.gender === 'female' ? 'female' : 'male'];
  const kj = k.c + k.hr * hr + k.kg * (p.weight || 70) + k.age * (p.age || 25);
  return kj > 0 ? kj / 4.184 : null;
}

/* ---------- 动作名称 -> 物理参数 ---------- */
function matchMovement(rawName){
  const KB = EXERCISE_KB;
  const name = String(rawName || '').toLowerCase().replace(/[\s（）()·\-_/]+/g, '');
  if (!name) return null;
  let loadType = null, rest = name;
  for (const tok in KB.modifiers.load)
    if (rest.includes(tok)){ loadType = KB.modifiers.load[tok]; rest = rest.split(tok).join(''); }
  const tags = [], hitTokens = [];
  for (const tok in KB.modifiers.position){
    if (!rest.includes(tok)) continue;
    const cfg = KB.modifiers.position[tok];
    if (tags.indexOf(cfg.tag) < 0) tags.push(cfg.tag);
    hitTokens.push(tok);
    rest = rest.split(tok).join('');
  }
  let best = null, bestScore = 0;
  for (const mv of KB.movements){
    const supportsLoad = loadType && (mv.loads[loadType] !== undefined || (loadType === 'bw' && mv.bw));
    for (const k of [mv.name].concat(mv.aliases || [])){
      const kk = k.toLowerCase().replace(/[\s（）()·\-_/]+/g, '');
      const hitRest = kk && rest.includes(kk), hitFull = kk && name.includes(kk);
      if (!hitRest && !hitFull) continue;
      let sc = kk.length * 10;
      if (!hitRest) sc -= 12;
      if (rest === kk || name === kk) sc += 60;
      if (supportsLoad) sc += 35;
      if (rest.endsWith(kk) || name.endsWith(kk)) sc += 8;
      if (sc > bestScore){ bestScore = sc; best = mv; }
    }
  }
  if (!best) return null;
  const own = [best.name].concat(best.aliases || []).join('').toLowerCase();
  let romMul = 1, cMul = 1, tempoMul = 1, unilateral = false, assist = !!best.assist;
  const done = [];
  for (const tok of hitTokens){
    const cfg = KB.modifiers.position[tok];
    if (!cfg || own.includes(tok) || done.indexOf(cfg.tag) >= 0) continue;
    done.push(cfg.tag);
    romMul *= cfg.romMul || 1; cMul *= cfg.cMul || 1; tempoMul *= cfg.tempoMul || 1;
    if (cfg.unilateral) unilateral = true;
    if (cfg.assist) assist = true;
  }
  let lt = (loadType && best.loads[loadType] !== undefined) ? loadType : null;
  if (!lt && loadType === 'bw' && best.bw) lt = 'bw';
  if (!lt) lt = best.defaultLoad || Object.keys(best.loads)[0];
  let c = best.loads[lt];
  if (c === undefined) c = Object.values(best.loads)[0] || 0;
  return { mv:best, id:best.id, loadType:lt, rom:+(best.rom * romMul).toFixed(3),
           tier:best.tier, bw:best.bw || 0, lever:best.lever || 1, met:best.met || 0,
           hold:!!best.hold, assist:assist, unilateral:unilateral, tempoMul:tempoMul,
           c:+(c * cMul).toFixed(3), tags:tags, score:bestScore, confident:bestScore >= 60 };
}

/* 动作对象 -> 物理参数（带缓存）。自定义动作保存时已固化 phys，直接取用 */
const _physCache = {};
function physOf(a){
  if (!a) return { rom:0.40, tier:'isolation', bw:0, lever:1, loadType:'bar', hold:false };
  if (a.phys) return a.phys;
  if (_physCache[a.id]) return _physCache[a.id];
  const m = matchMovement(a.name);
  const ph = m ? { rom:m.rom, tier:m.tier, bw:m.bw, lever:m.lever, loadType:a.load || m.loadType,
                   hold:m.hold, met:m.met, assist:m.assist, unilateral:m.unilateral }
               : { rom:0.40, tier:(a.compound ? 'compound_upper' : 'isolation'),
                   bw:(a.c ? 0 : 0.5), lever:1, loadType:a.load || 'bar', hold:false, fallback:1 };
  _physCache[a.id] = ph;
  return ph;
}

/* 把识别结果固化进自定义动作，之后计算直接读 phys，不再每次重算 */
function resolveCustomPhys(d){
  const KB = EXERCISE_KB;
  let m = null;
  if (d.refId){
    const mv = KB.movements.find(x => x.id === d.refId);
    if (mv){
      const lt = mv.defaultLoad || Object.keys(mv.loads)[0];
      m = { mv:mv, loadType:lt, rom:mv.rom, tier:mv.tier, bw:mv.bw || 0,
            lever:mv.lever || 1, met:mv.met || 0, hold:!!mv.hold, assist:!!mv.assist,
            unilateral:false, c:mv.loads[lt] || 0 };
    }
  }
  if (!m) m = matchMovement(d.name || '');
  if (!m) return null;
  return { phys:{ rom:m.rom, tier:m.tier, bw:m.bw, lever:m.lever, loadType:m.loadType,
                  hold:m.hold, met:m.met, assist:m.assist, unilateral:m.unilateral },
           load:m.loadType, c:m.c, refId:m.mv.id, compound:/compound|full/.test(m.tier) ? 1 : 0 };
}
/* ---------- 力量：机械功 + 做组开销 + 组间休息 ---------- */
function strengthEst(a, f, p){
  const C = EXERCISE_KB.constants, kg = p.weight || 70;
  const ph = physOf(a);
  const lvl = STRENGTH_LEVELS.find(l => l.id === f.intensity) || STRENGTH_LEVELS[1];
  const sets = (f.setList || []).length || 1;
  const restSec = num(f.restSec, 90), workSec = num(f.workSec, 40);

  if (ph.hold){
    const min = sets * workSec / 60;
    const net = netKcalOf(ph.met || 3.5, kg, min);
    return { net:net, gross:net + rmrMin(p) * min, min:min,
             met:min > 0 ? (net + rmrMin(p)*min) / (kg*0.0175*min) : 0, mech:0 };
  }
  const lt = EXERCISE_KB.loadTypes[ph.loadType] || EXERCISE_KB.loadTypes.other;
  const mult = ph.unilateral ? 1 : (lt.mult || 1);
  let W = 0;
  for (const s of (f.setList || [])){
    const reps = Math.max(0, num(s.r, 0));
    const m_eff = ph.assist ? Math.max(0, (ph.bw || 1) * kg - num(s.w, 0))
                            : num(s.w, 0) * mult + (ph.bw || 0) * kg;
    W += m_eff * C.G * ph.rom * (ph.lever || 1) * reps * (1 + C.ECC_FACTOR);
  }
  const tWork = sets * workSec / 60, tRest = sets * restSec / 60, tAll = tWork + tRest;
  const tierMet = (EXERCISE_KB.tiers[ph.tier] || EXERCISE_KB.tiers.isolation).met * lvl.ohMul;
  const net = W / C.EFFICIENCY / C.J_PER_KCAL
            + netKcalOf(tierMet, kg, tWork)
            + netKcalOf(C.MET_INTERSET_REST, kg, tRest);
  const gross = net + rmrMin(p) * tAll;
  return { net:net, gross:gross, min:tAll, mech:W / C.EFFICIENCY / C.J_PER_KCAL,
           met:tAll > 0 ? gross / (kg * 0.0175 * tAll) : 0 };
}

/* ---------- 有氧 ---------- */
function cardioEst(f, p){
  const min = num(f.durMin, 0), kg = p.weight || 70;
  const m = CARDIO_MODES[f.mode] || {};
  let met = 4.5, note = '';
  let speed = num(f.speed, 0);
  if (m.kind === 'speed' && num(f.distKm, 0) > 0 && min > 0)
    speed = num(f.distKm, 0) / (min / 60);        // 距离+时长反推配速，比手拨更可靠
  if (m.kind === 'speed'){
    met = f.mode === 'run' ? runMet(speed) : walkMet(speed);
    note = speed.toFixed(1) + ' km/h' + (num(f.distKm,0) > 0 ? '（按距离）' : '');
  } else if (m.kind === 'slope'){
    met = inclineMet(num(f.slope, 0), speed);
    note = `坡度 ${num(f.slope,0)}% · ${speed} km/h`;
  } else if (m.watt && num(f.watts, 0) > 0){
    met = wattMet(num(f.watts, 0), kg);
    note = num(f.watts, 0) + ' W';
  } else {
    met = (m.levels || [5, 6, 7])[num(f.level, 1)];
    note = LEVEL_NAMES[num(f.level, 1)];
  }
  const hrRate = keytelKcalMin(num(f.avgHr, 0), p);
  if (hrRate != null){
    const gross = hrRate * min, rest = rmrMin(p) * min;
    return { net:Math.max(0, gross - rest), gross:gross, min:min,
             met:min > 0 ? gross / (kg * 0.0175 * min) : 0,
             note:`心率 ${num(f.avgHr,0)} bpm · ${note}`, src:'hr' };
  }
  return { net:netKcalOf(met, kg, min), gross:grossKcalOf(met, p, min), min:min,
           met:met, note:note, src:'met' };
}

/* 补记往期训练时，取体重日志里离那天最近的一条 */
function profileAt(dateStr){
  const p = Store.profile();
  const ws = (Store.weights() || []).filter(w => w && w.weight && w.date);
  if (!dateStr || !ws.length) return p;
  let best = null, bd = Infinity;
  for (const w of ws){
    const d = Math.abs(new Date(w.date) - new Date(dateStr));
    if (d < bd){ bd = d; best = w; }
  }
  return best && best.weight ? { ...p, weight: best.weight } : p;
}
const round5 = v => Math.round(v / 5) * 5;

/* ================= 存储 ================= */
const SCHEMA = 2;
const clone = o => typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o));
const DEFAULTS = {
  profile:   { height:175, weight:70, age:25, gender:'male' },
  records:   {},
  custom:    [],
  weights:   [],
  templates: [],
  settings:  { defaultLevel:'mid', defaultRest:90, defaultWork:40, netKcal:true, theme:'auto', sound:true, autoRest:true },
  meta:      { schema:SCHEMA, lastBackup:null },
};
const cache = {};
const Store = {
  get(k){
    if (cache[k] !== undefined) return cache[k];
    let v;
    try {
      const raw = localStorage.getItem('fit_' + k);
      v = raw !== null ? JSON.parse(raw) : null;
    } catch (e) { v = null; }
    if (v === null || typeof v !== 'object' && typeof v !== typeof DEFAULTS[k]) v = clone(DEFAULTS[k]);
    if (Array.isArray(DEFAULTS[k]) !== Array.isArray(v)) v = clone(DEFAULTS[k]);
    if (!Array.isArray(DEFAULTS[k]) && DEFAULTS[k] && typeof DEFAULTS[k] === 'object') v = { ...clone(DEFAULTS[k]), ...v };
    cache[k] = v;
    return v;
  },
  set(k, v){
    cache[k] = v;
    try { localStorage.setItem('fit_' + k, JSON.stringify(v)); }
    catch (e) { toast('存储失败：空间已满或浏览器禁止了本地存储'); return false; }
    IDB.mirror(k, v);
    return true;
  },
  profile(){ return this.get('profile'); },
  records(){ return this.get('records'); },
  custom(){ return this.get('custom'); },
  settings(){ return this.get('settings'); },
  weights(){ return this.get('weights'); },
  templates(){ return this.get('templates'); },
  meta(){ return this.get('meta'); },
  snapshot(){
    return { app:'健身记录', version:SCHEMA, exportedAt:new Date().toISOString(),
      profile:this.profile(), records:this.records(), custom:this.custom(),
      settings:this.settings(), weights:this.weights(), templates:this.templates() };
  },
};

/* IndexedDB 副本：localStorage 被系统清理时可恢复 */
const IDB = {
  db: null, ready: false,
  open(){
    return new Promise(res => {
      if (!window.indexedDB) return res(null);
      let req;
      try { req = indexedDB.open('fitlog', 1); } catch (e) { return res(null); }
      req.onupgradeneeded = () => { try { req.result.createObjectStore('kv'); } catch (e) {} };
      req.onsuccess = () => { this.db = req.result; this.ready = true; res(this.db); };
      req.onerror = () => res(null);
    });
  },
  mirror(k, v){
    if (!this.ready || !this.db) return;
    try {
      const tx = this.db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(JSON.stringify(v), k);
    } catch (e) {}
  },
  read(k){
    return new Promise(res => {
      if (!this.ready || !this.db) return res(null);
      try {
        const r = this.db.transaction('kv', 'readonly').objectStore('kv').get(k);
        r.onsuccess = () => { try { res(r.result ? JSON.parse(r.result) : null); } catch (e) { res(null); } };
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async restoreIfEmpty(){
    if (localStorage.getItem('fit_records') !== null) return false;
    const recs = await this.read('records');
    if (!recs || !Object.keys(recs).length) return false;
    for (const k of ['profile', 'records', 'custom', 'weights', 'settings', 'templates']) {
      const v = await this.read(k);
      if (v) { delete cache[k]; try { localStorage.setItem('fit_' + k, JSON.stringify(v)); } catch (e) {} }
    }
    return true;
  },
};

/* ================= 数据迁移（旧格式 → 逐组格式） ================= */
function migrate(){
  const meta = Store.meta();
  if (meta.schema >= SCHEMA) return;
  const recs = Store.records();
  let touched = 0;
  Object.keys(recs).forEach(date => {
    if (!Array.isArray(recs[date])) { delete recs[date]; return; }
    recs[date] = recs[date].map(it => {
      const m = BUILTIN.find(b => b.id === it.aid);
      if (!it.ico || /[^a-z0-9_-]/i.test(it.ico)) it.ico = m ? m.ico : (it.type === 'cardio' ? 'run' : 'star');
      if (it.type !== 'cardio' && !Array.isArray(it.setList)) {
        const n = Math.max(1, Math.round(num(it.sets, 1)));
        const reps = Array.isArray(it.repsList) && it.repsList.length
          ? it.repsList : new Array(n).fill(Math.round(num(it.reps, 10)));
        it.setList = reps.map(r => ({ w: num(it.weight, 0), r: Math.round(num(r, 10)), done: 1 }));
        delete it.sets; delete it.reps; delete it.repsList; delete it.weight;
        touched++;
      }
      // 历史记录沿用保存时的口径，不用新模型重算，避免进步曲线整体跳一次
      if (it.kcalNet == null) it.kcalNet = Math.round(calcKcal(num(it.met, 0), Store.profile().weight || 70, num(it.durMin, 0), true));
      if (it.mv == null) it.mv = 1;
      return it;
    });
  });
  Store.set('records', recs);
  const custom = Store.custom().map(c => {
    if (!c.ico || /[^a-z0-9_-]/i.test(c.ico)) c.ico = 'star';
    // 旧版自定义动作一律写死 met=4.2，这里用知识库重新识别一次补上真实参数
    if (c.type !== 'cardio' && !c.phys){
      const R = resolveCustomPhys(c);
      if (R){
        c.phys = R.phys; c.load = R.load; c.compound = R.compound; c.refId = R.refId;
        if (!num(c.c, 0)) c.c = R.c;
      } else {
        c.phys = { rom:0.40, tier:'compound_upper', bw:0, lever:1, loadType:c.load || 'bar',
                   hold:false, fallback:1 };
      }
      delete c.met;
      touched++;
    }
    if (c.c == null) c.c = 0;
    if (!c.load) c.load = 'bar';
    return c;
  });
  Store.set('custom', custom);
  meta.schema = SCHEMA;
  Store.set('meta', meta);
  if (touched) console.info('[健身记录] 已迁移 ' + touched + ' 条旧记录到逐组格式');
}

/* ================= 动作查询 ================= */
let _actCache = null;
function allActions(){
  if (_actCache) return _actCache;
  _actCache = [...BUILTIN, ...Store.custom().map(c => ({ type:'weight', compound:0, load:'bar', c:0, ...c, custom:1 }))];
  return _actCache;
}
function invalidateActions(){ _actCache = null; }
function getAction(aid){ return allActions().find(a => a.id === aid) || null; }

/* 记录里的某个动作的全部历史（新 → 旧） */
function historyOf(aid){
  const recs = Store.records();
  const out = [];
  Object.keys(recs).forEach(date => (recs[date] || []).forEach((it, idx) => {
    if (it.aid === aid) out.push({ date, idx, it });
  }));
  out.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.idx - a.idx);
  return out;
}
function lastRecordOf(aid, exceptRef){
  const h = historyOf(aid);
  for (const r of h) {
    if (exceptRef && r.date === exceptRef.date && r.idx === exceptRef.idx) continue;
    return r;
  }
  return null;
}
const volOf = it => !it || it.type === 'cardio' || !Array.isArray(it.setList)
  ? 0 : it.setList.reduce((s, x) => s + num(x.w, 0) * num(x.r, 0), 0);
const maxWOf = it => !it || !Array.isArray(it.setList)
  ? 0 : it.setList.reduce((s, x) => Math.max(s, num(x.w, 0)), 0);
const dayVol = items => (items || []).reduce((s, it) => s + volOf(it), 0);
const dayKcal = (items, net) => (items || []).reduce((s, it) => s + num(net ? it.kcalNet : it.kcal, 0), 0);
const dayMin = items => (items || []).reduce((s, it) => s + num(it.durMin, 0), 0);

/* ================= 全局状态 ================= */

  cat: 'chest', q: '', editing: null, editRef: null, form: null,
  date: todayStr(), dateTouched: false,
  _met: 0, _durMin: 0, _kcal: 0, _kcalNet: 0,
  histDays: 7, histPage: 1, chartMode: 'kcal', trendAid: '',
  customDraft: { cat:'chest', ico:'star', type:'weight' },
  editingCustom: null,
};

const useNet = () => !!S().netKcal;
const kcalOf = it => num(useNet() ? it.kcalNet : it.kcal, 0);

/* ================= Toast（支持撤销） ================= */
let _undoFn = null, _toastTimer = null;
function toast(msg, undoFn){
  const t = $('#toast');
  t.querySelector('.tt').textContent = msg;
  t.classList.toggle('has-undo', !!undoFn);
  _undoFn = undoFn || null;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.classList.remove('show'); _undoFn = null; }, undoFn ? 5200 : 1900);
}
function hideToast(){ $('#toast').classList.remove('show'); _undoFn = null; clearTimeout(_toastTimer); }

/* ================= 弹层 ================= */
let _modalOnClose = null;
function openModal(html, onClose){
  $('#modal').innerHTML = html;
  $('#modal').classList.add('show');
  $('#modalMask').classList.add('show');
  _modalOnClose = onClose || null;
}
function closeModal(){
  $('#modal').classList.remove('show');
  $('#modalMask').classList.remove('show');
  const f = _modalOnClose; _modalOnClose = null;
  if (f) f();
}
function confirmBox(title, text, okText, onOk, danger){
  openModal(`<div class="modal-title">${esc(title)}</div>
    <div class="modal-text">${text}</div>
    <div class="modal-row">
      <button class="btn-save secondary" data-mo="cancel">取消</button>
      <button class="btn-save ${danger ? 'danger' : ''}" data-mo="ok">${esc(okText)}</button>
    </div>`);
  $('#modal').querySelector('[data-mo="cancel"]').onclick = closeModal;
  $('#modal').querySelector('[data-mo="ok"]').onclick = () => { closeModal(); onOk(); };
}

function applyTheme(){
  const t = S().theme || 'auto';
  const dark = t === 'dark' || (t === 'auto' && !window.matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#0d0f14' : '#f5f6f8');
}

/* 最近 14 天练过的动作 */
function recentAidMap(){
  const recs = Store.records(), out = {}, from = shiftDate(todayStr(), -14);
  Object.keys(recs).forEach(d => { if (d >= from) (recs[d] || []).forEach(it => out[it.aid] = 1); });

/* 单条记录的渲染（历史页复用） */
function detailText(it){
  if (it.type === 'cardio'){
    const m = CARDIO_MODES[it.mode] || {};
    let t = fmtHM(it.durMin);
    if (m.kind === 'speed') t += ` · ${it.speed}km/h`;
    else if (m.kind === 'slope') t += ` · 坡度${it.slope}% · ${it.speed}km/h`;
    else t += ` · ${LEVEL_NAMES[num(it.level, 1)] || '中等'}`;
    if (it.distKm) t += ` · ${it.distKm}km`;
    return t;
  }
  const sets = Array.isArray(it.setList) ? it.setList : [];
  if (!sets.length) return fmtHM(it.durMin);
  const same = sets.every(s => s.w === sets[0].w && s.r === sets[0].r);
  let t = same
    ? `${sets.length}组 × ${sets[0].r}次${sets[0].w ? ' × ' + fmtKg(sets[0].w) + 'kg' : '（自重）'}`
    : sets.map(s => (s.w ? fmtKg(s.w) + '×' : '') + s.r).join(' / ');
  const v = volOf(it);
  if (v) t += ` · 容量 ${fmtVol(v)}`;
  return t;
}
function histItemHTML(it, date, i){
  return `<div class="hist-item" data-edit="${date}|${i}">
    <div class="hi-main">
      <div class="hi-name">${ico(it.ico || 'star')}${esc(it.name)}<span class="hi-time">${esc(it.time || '')}</span></div>
      <div class="hi-detail">${esc(detailText(it))}</div>
    </div>
    <div class="hi-right">
      <span class="hi-kcal">${Math.round(kcalOf(it))} kcal</span>
      <button class="hi-del" data-del="${date}|${i}" aria-label="删除">${ico('trash')}</button>

}

/* ================= 休息计时器 ================= */
const Rest = {
  endAt: 0, total: 0, id: null, label: '', done: false,
  start(sec, label){
    this.total = sec; this.endAt = Date.now() + sec * 1000; this.label = label || '组间休息'; this.done = false;
    $('#restBar').classList.add('show'); $('#restBar').classList.remove('done');
    $('#restT1').textContent = this.label;
    $('#restStop').textContent = '结束';
    if (this.id) clearInterval(this.id);
    this.tick();
    this.id = setInterval(() => this.tick(), 250);
  },
  add(sec){ if (!this.endAt) return; if (this.done) { this.start(sec, this.label); return; } this.endAt += sec * 1000; this.total += sec; this.tick(); },
  stop(){
    if (this.id) clearInterval(this.id);
    this.id = null; this.endAt = 0; this.done = false;
    $('#restBar').classList.remove('show', 'done');
  },
  tick(){
    const left = Math.max(0, (this.endAt - Date.now()) / 1000);
    const r = 17, C = 2 * Math.PI * r;
    const frac = this.total ? clamp(left / this.total, 0, 1) : 0;
    const ring = $('#restRing');
    ring.setAttribute('stroke-dasharray', C.toFixed(1));
    ring.setAttribute('stroke-dashoffset', (C * (1 - frac)).toFixed(1));
    $('#restTime').textContent = left >= 60 ? fmtMMSS(left) : Math.ceil(left);
    $('#restT2').textContent = this.done ? '可以开始下一组了' : `还剩 ${Math.ceil(left)} 秒`;
    if (left <= 0 && !this.done){
      this.done = true;
      $('#restBar').classList.add('done');
      $('#restT1').textContent = '休息结束';
      $('#restStop').textContent = '知道了';
      notifyDone();
      if (this.id) { clearInterval(this.id); this.id = null; }
    }
  },
};
let _audio = null;
function notifyDone(){
  if (!S().sound) return;
  try { if (navigator.vibrate) navigator.vibrate([180, 90, 180]); } catch (e) {}
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    _audio = _audio || new AC();
    if (_audio.state === 'suspended') _audio.resume();
    [0, 0.22, 0.44].forEach((t, i) => {
      const o = _audio.createOscillator(), g = _audio.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1046 : 784;
      g.gain.setValueAtTime(0.0001, _audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, _audio.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, _audio.currentTime + t + 0.18);
      o.connect(g); g.connect(_audio.destination);
      o.start(_audio.currentTime + t); o.stop(_audio.currentTime + t + 0.2);
    });
  } catch (e) {}
}

function refWeights(action, p){
  if (!action || action.type === 'cardio') return null;
  const c = num(action.c, 0);
  if (!c) return null;
  const w = p.weight || 70;
  const r25 = v => Math.max(2.5, Math.round(v / 2.5) * 2.5);
  return { mid: r25(c * w), midLo: r25(c * w * .9), midHi: r25(c * w * 1.1),
    lightLo: r25(c * w * .4), lightHi: r25(c * w * .6),
    heavyLo: r25(c * w * 1.2), heavyHi: r25(c * w * 1.5) };
}
function strengthRefHTML(){
  const a = state.editing, p = Store.profile();
  const cur = state.form ? state.form.intensity : 'mid';
  if (!a) return '';
  if (a.custom && !num(a.c, 0) && !physOf(a).bw)
    return `<div class="ref-box" id="strRefBox">这个动作没认出参考重量，按感觉选：<b>轻量</b>=轻松做完，<b>标准</b>=有点吃力，<b>大重量</b>=勉强完成。想要参考区间，可以到「我的 → 自定义动作」里指定一个参照动作或填标准重量。</div>`;
  if (!num(a.c, 0))
    return `<div class="ref-box" id="strRefBox"><b>${esc(a.name)}</b> 是自重动作，负荷就是你的体重（约 ${p.weight || 70}kg）。强度靠次数体现：<b>轻量</b>=轻松15次以上，<b>标准</b>=8-12次接近力竭，<b>大重量</b>=1-6次（可挂负重）。重量栏可填加负重量，不加就留 0。</div>`;
  const R = refWeights(a, p), g = p.gender === 'female' ? '女' : '男';
  const row = (id, lv, lo, hi, times, feel) =>
    `<div class="ref-row ${cur === id ? 'on' : ''}"><span class="rl">${lv}</span><span>${lo}~${hi}kg</span><span class="rm">${times} · ${feel}</span></div>`;
  return `<div class="ref-box" id="strRefBox">
    <b>重量参考</b> · 按 ${p.height || 175}cm / ${p.weight || 70}kg（${g}）估算，填的是${LOAD_TXT[a.load] || '总重量'}
    ${row('light', '轻量', R.lightLo, R.lightHi, '12-15次', '热身/耐力')}
    ${row('mid', '标准', R.midLo, R.midHi, '6-12次', '常规增肌组')}
    ${row('heavy', '大重量', R.heavyLo, R.heavyHi, '1-5次', '力量/极限')}
    <div class="ref-note">这只是起步参考，不是目标。以你实际能用标准动作完成的重量为准，练了一段时间后请以「上次记录」为基准加重。</div>
  </div>`;
}
function lastBoxHTML(){
  const a = state.editing;
  if (!a) return '';
  const last = lastRecordOf(a.id, state.editRef);
  if (!last) return `<div class="last-box"><div class="lb-txt">第一次记录这个动作。保存后，下次打开会自动带出这次的重量和组次。</div></div>`;
  const it = last.it;
  const best = historyOf(a.id).reduce((m, r) => Math.max(m, maxWOf(r.it)), 0);
  const isPR = maxWOf(it) >= best && best > 0;
  return `<div class="last-box">
    <div class="lb-txt">上次 <b>${fmtDateShort(last.date)}</b>（${relDay(last.date)}）
      <span class="lb-sets">${esc(detailText(it))}</span>

function defaultSetList(action){
  const last = lastRecordOf(action.id, null);
  if (last && Array.isArray(last.it.setList) && last.it.setList.length)
    return last.it.setList.map(s => ({ w: num(s.w, 0), r: num(s.r, 10), done: 0 }));
  const R = refWeights(action, Store.profile());
  const w = R ? R.mid : 0;
  return [0, 1, 2, 3].map(() => ({ w, r: 10, done: 0 }));
}
function openDrawer(action, prefill, editRef){
  state.editing = action;

        : defaultSetList(action),

    };

function previewHTML(){
  return `<div class="kcal-preview">
    <div class="kv"><span class="k" id="preLabel">预计消耗</span><span class="v" id="preKcal">0 kcal</span></div>
    <div class="note" id="preNote">MET — · 时长 —</div>
  </div>`;
}
/* 根据填写的重量自动推荐强度档 */
function autoIntensity(){
  const f = state.form, a = state.editing;
  if (!a || f.intensityTouched) return;
  const R = refWeights(a, Store.profile());
  if (!R) return;
  const ws = f.setList.map(s => num(s.w, 0)).filter(w => w > 0);
  if (!ws.length) return;
  const avg = ws.reduce((s, w) => s + w, 0) / ws.length;
  const lv = avg < R.mid * 0.68 ? 'light' : avg > R.mid * 1.15 ? 'heavy' : 'mid';
  if (lv === f.intensity) return;
  f.intensity = lv;
  const seg = $('#intensitySeg');
  if (seg) seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.lv === lv));
  const hint = $('#intensityHint');
  if (hint) hint.textContent = (STRENGTH_LEVELS.find(l => l.id === lv) || {}).desc + '（按重量自动判断）';
  const rb = $('#strRefBox');
  if (rb) rb.outerHTML = strengthRefHTML();
}
function recalc(){
  const f = state.form;
  if (!f) return;
  const p = profileAt(state.date), a = state.editing;
  const r = f.type === 'weight' ? strengthEst(a, f, p) : cardioEst(f, p);
  let note = r.note;
  if (f.type === 'weight'){
    const vol = f.setList.reduce((s, x) => s + num(x.w, 0) * num(x.r, 0), 0);
    const ph = physOf(a);
    note = `${f.setList.length}组 · ${vol ? '容量 ' + fmtVol(vol) : '自重'}`
         + (r.mech > 0 ? ` · 举起做功 ${Math.round(r.mech)} kcal` : '');
    if (ph.fallback) note += ' · 参数未识别，按保守值估算';
  }
  const net = useNet();
  state._met = r.met; state._durMin = r.min;
  state._kcal = r.gross; state._kcalNet = r.net;
  const el = $('#preKcal');
  if (!el) return;
  el.textContent = '约 ' + round5(net ? state._kcalNet : state._kcal) + ' kcal';
  $('#preLabel').textContent = net ? '预计净消耗' : '预计总消耗';
  $('#preNote').innerHTML = `等效 MET ${r.met.toFixed(1)} · ${fmtHM(r.min)}<br>${esc(note || '')}`;
}
function syncSetsUI(full){
  if (full) $('#setsWrap').innerHTML = setsHTML();
  const s = $('#setsSum');
  if (s) s.innerHTML = setsSummary();
  recalc();
}
function bindDrawerEvents(){
  const body = $('#drawerBody');
  body.onclick = e => {
    const t = e.target;
    const step = t.closest('.step-btn');
    if (step){
      const st = step.closest('.stepper'), key = st.dataset.id;
      let v = num(state.form[key], 0) + parseFloat(step.dataset.d);
      v = clamp(Math.round(v * 100) / 100, parseFloat(st.dataset.min), parseFloat(st.dataset.max));
      state.form[key] = v;
      setStepper(key, v);
      if (key === 'durMin' || key === 'speed') syncCardio(key);
      if (key === 'restSec'){ const b = body.querySelector('[data-rest]'); if (b) b.innerHTML = ico('clock') + `开始休息 ${v}s`; }
      recalc();
      return;
    }
    const lv = t.closest('#intensitySeg button');
    if (lv){
      state.form.intensity = lv.dataset.lv;
      state.form.intensityTouched = true;
      lv.parentNode.querySelectorAll('button').forEach(b => b.classList.remove('on'));
      lv.classList.add('on');
      $('#intensityHint').textContent = lv.dataset.desc;
      const rb = $('#strRefBox');
      if (rb) rb.outerHTML = strengthRefHTML();
      recalc();
      return;
    }
    const cl = t.closest('#cardioLevelSeg button');
    if (cl){
      state.form.level = +cl.dataset.lv;
      cl.parentNode.querySelectorAll('button').forEach(b => b.classList.remove('on'));
      cl.classList.add('on');
      recalc();
      return;
    }
    const qs = t.closest('[data-qs]');
    if (qs){ state.form.speed = parseFloat(qs.dataset.qs); setStepper('speed', state.form.speed); syncCardio('speed'); recalc(); return; }
    const qsl = t.closest('[data-qsl]');
    if (qsl){ state.form.slope = parseFloat(qsl.dataset.qsl); setStepper('slope', state.form.slope); recalc(); return; }
    const add = t.closest('[data-addset]');
    if (add){
      const l = state.form.setList, last = l[l.length - 1] || { w: 0, r: 10 };
      l.push({ w: last.w, r: last.r, done: 0 });
      syncSetsUI(true);
      return;
    }
    const cp = t.closest('[data-copyset]');
    if (cp){
      const l = state.form.setList;
      if (l.length){ const last = l[l.length - 1]; l.push({ w: last.w, r: last.r, done: 0 }); syncSetsUI(true); }
      return;
    }
    const rm = t.closest('[data-rm]');
    if (rm){
      if (state.form.setList.length <= 1){ toast('至少保留一组'); return; }
      state.form.setList.splice(+rm.dataset.rm, 1);
      syncSetsUI(true);
      return;
    }
    const dn = t.closest('[data-done]');
    if (dn){
      const i = +dn.dataset.done, s = state.form.setList[i];
      s.done = s.done ? 0 : 1;
      dn.classList.toggle('on', !!s.done);
      dn.closest('.set-row').classList.toggle('done', !!s.done);
      if (s.done && S().autoRest) Rest.start(num(state.form.restSec, 90), `休息 · ${state.editing.name} 第${i + 1}组后`);
      return;
    }
    const ul = t.closest('[data-use-last]');
    if (ul){
      const last = lastRecordOf(state.editing.id, state.editRef);
      if (last && Array.isArray(last.it.setList)){
        state.form.setList = last.it.setList.map(s => ({ w: s.w, r: s.r, done: 0 }));
        state.form.restSec = num(last.it.restSec, state.form.restSec);
        state.form.workSec = num(last.it.workSec, state.form.workSec);
        setStepper('restSec', state.form.restSec); setStepper('workSec', state.form.workSec);
        syncSetsUI(true);
        toast('已沿用上次的重量和组次');
      }
      return;
    }
    const rest = t.closest('[data-rest]');
    if (rest){ Rest.start(num(state.form.restSec, 90), `休息 · ${state.editing.name}`); toast('开始计时'); return; }
    const sv = t.closest('[data-save]');
    if (sv){ saveRecord(sv.dataset.save === 'again'); return; }
  };
  body.oninput = e => {
    const t = e.target;
    if (t.dataset.k){
      const s = state.form.setList[+t.dataset.i];
      if (!s) return;
      s[t.dataset.k] = Math.max(0, num(t.value, 0));
      if (t.dataset.k === 'w') autoIntensity();
      syncSetsUI(false);
      return;
    }
    if (t.id === 'distInput'){ state.form.distKm = Math.max(0, num(t.value, 0)); syncCardio('dist'); recalc(); return; }
    if (t.id === 'hrInput'){ state.form.avgHr = Math.max(0, num(t.value, 0)); recalc(); return; }
    if (t.id === 'wattInput'){ state.form.watts = Math.max(0, num(t.value, 0)); recalc(); return; }
    if (t.id === 'noteInput'){ state.form.note = t.value; return; }
  };
}
/* 时长 / 距离 / 速度 三者联动 */
function syncCardio(changed){
  const f = state.form;
  if (!f || f.type !== 'cardio') return;
  const m = CARDIO_MODES[f.mode] || {};
  if (m.kind !== 'speed') return;
  if (changed === 'dist'){
    if (f.distKm > 0 && f.durMin > 0){
      f.speed = clamp(+(f.distKm / (f.durMin / 60)).toFixed(1), m.min, m.max);
      setStepper('speed', f.speed);
    }
  } else {
    f.distKm = +(f.speed * f.durMin / 60).toFixed(2);
    const d = $('#distInput');
    if (d && document.activeElement !== d) d.value = f.distKm;
  }
}

/* ================= 保存 ================= */
function saveRecord(again){
  const f = state.form, a = state.editing;
  if (!a) return;
  if (f.type === 'weight'){
    f.setList = f.setList.filter(s => num(s.r, 0) > 0);
    if (!f.setList.length){ toast('每组次数不能为 0'); state.form.setList = [{ w: 0, r: 10, done: 0 }]; syncSetsUI(true); return; }
  } else if (!(num(f.durMin, 0) > 0)){ toast('请填写运动时长'); return; }
  recalc();
  const now = new Date();
  const prevBest = historyOf(a.id).reduce((m, r) =>
    (state.editRef && r.date === state.editRef.date && r.idx === state.editRef.idx) ? m : Math.max(m, maxWOf(r.it)), 0);
  const item = {
    id: Date.now() + Math.floor(Math.random() * 1000),
    time: pad2(now.getHours()) + ':' + pad2(now.getMinutes()),
    aid: a.id, name: a.name, ico: a.ico || 'star', cat: a.cat, type: a.type,
    met: +state._met.toFixed(2), durMin: +state._durMin.toFixed(1),
    kcal: Math.round(state._kcal), kcalNet: Math.round(state._kcalNet), mv: 2,
    note: (f.note || '').trim() || undefined,
  };
  if (a.type === 'weight'){
    item.setList = f.setList.map(s => ({ w: num(s.w, 0), r: num(s.r, 0), done: s.done ? 1 : 0 }));
    item.intensity = f.intensity; item.restSec = f.restSec; item.workSec = f.workSec;
  } else {
    item.mode = f.mode; item.level = f.level; item.speed = f.speed; item.slope = f.slope;
    if (f.distKm) item.distKm = +f.distKm.toFixed(2);
    if (f.avgHr) item.avgHr = num(f.avgHr, 0);
    if (f.watts) item.watts = num(f.watts, 0);
  }
  const recs = Store.records();
  if (state.editRef){
    const { date, idx } = state.editRef;
    if (recs[date] && recs[date][idx]){
      item.id = recs[date][idx].id;
      item.time = recs[date][idx].time || item.time;
      recs[date][idx] = item;
      Store.set('records', recs);
      closeDrawer();
      refreshAll();
      toast('记录已更新');
      return;
    }
  }
  const date = state.date || todayStr();
  (recs[date] = recs[date] || []).push(item);
  Store.set('records', recs);
  const newBest = maxWOf(item);
  const isPR = a.type === 'weight' && newBest > prevBest && prevBest > 0;
  refreshAll();
  toast(isPR ? `新纪录！${a.name} ${fmtKg(newBest)}kg` : `已记录 ${a.name} · ${Math.round(kcalOf(item))} kcal`);
  if (again){
    openDrawer(a, { ...f, setList: f.setList.map(s => ({ ...s, done: 0 })) });
    if (S().autoRest) Rest.start(num(f.restSec, 90), `休息 · ${a.name}`);
  } else closeDrawer();
}
function refreshAll(){
  updateTopKcal();
  renderTodayList();
  renderActions();
  const active = document.querySelector('.page.active');
  if (active && active.id === 'page-history') renderHistory();
  if (active && active.id === 'page-stats') renderStats();
}
</script>
<script>
"use strict";
/* ================= 历史页 ================= */
const PAGE_DAYS = 12;
function renderHistory(){
  const page = $('#page-history');
  const recs = Store.records();
  const dates = Object.keys(recs).filter(d => (recs[d] || []).length).sort().reverse();
  if (!dates.length){
    page.innerHTML = `<div class="empty">${ico('list')}还没有训练记录<br>去「记录」页点一个动作就能开始</div>`;
    return;
  }
  const shown = dates.slice(0, state.histPage * PAGE_DAYS);
  const net = useNet();
  let html = `<div class="page-title">训练历史 <small>点一条记录可以修改</small></div>`;
  let curMonth = '';
  shown.forEach(date => {
    const mk = date.slice(0, 7);
    if (mk !== curMonth){
      curMonth = mk;
      const mItems = dates.filter(d => d.startsWith(mk));
      const mKcal = mItems.reduce((s, d) => s + dayKcal(recs[d], net), 0);
      html += `<div class="month-head">${+mk.slice(5)}月 · ${mItems.length} 天 · ${Math.round(mKcal)} kcal</div>`;
    }
    const items = recs[date];
    const vol = dayVol(items);
    html += `<div class="day-card">
      <div class="day-head">
        <div>
          <div class="day-date">${fmtDate(date)}</div>
          <div class="day-meta">${relDay(date)} · ${items.length}项 · ${fmtHM(dayMin(items))}${vol ? ' · 容量 ' + fmtVol(vol) : ''}</div>
        </div>
        <div class="day-right">
          <div class="day-kcal">${Math.round(dayKcal(items, net))} kcal</div>
          <div class="day-tools">
            <button data-copyday="${date}">${ico('copy')}复制到今天</button>
            <button data-tpl="${date}">${ico('layers')}存为模板</button>
          </div>
        </div>
      </div>
      ${items.map((it, i) => histItemHTML(it, date, i)).join('')}
    </div>`;
  });
  if (shown.length < dates.length)
    html += `<button class="load-more" data-more="1">加载更早的记录（还有 ${dates.length - shown.length} 天）</button>`;
  page.innerHTML = html;
}

/* 复制某天训练到今天 */
function copyDayToToday(date){
  const recs = Store.records();
  const src = recs[date] || [];
  if (!src.length) return;
  const t = todayStr();
  const now = new Date();
  const copies = src.map(it => ({ ...clone(it), id: Date.now() + Math.floor(Math.random() * 100000),
    time: pad2(now.getHours()) + ':' + pad2(now.getMinutes()),
    setList: Array.isArray(it.setList) ? it.setList.map(s => ({ ...s, done: 0 })) : undefined }));
  (recs[t] = recs[t] || []).push(...copies);
  Store.set('records', recs);
  state.date = t; state.dateTouched = false;
  applyDateUI(); refreshAll();
  toast(`已复制 ${copies.length} 项到今天`, () => {
    const r = Store.records();
    r[t] = (r[t] || []).filter(x => !copies.some(c => c.id === x.id));
    if (!r[t].length) delete r[t];
    Store.set('records', r); refreshAll(); hideToast();
  });
}
