function applyTemplate(tid){
  const tpl = Store.templates().find(t => t.id === tid);
  if (!tpl) return;
  const p = Store.profile(), kg = p.weight || 70;
  const recs = Store.records(), date = state.date || todayStr();
  const now = new Date();
  const added = tpl.items.map(t => {
    const a = getAction(t.aid) || { id: t.aid, name: '已删除的动作', ico: 'star', cat: 'full', met: 4.5, type: t.type || 'weight' };
    const it = { id: Date.now() + Math.floor(Math.random() * 100000),
      time: pad2(now.getHours()) + ':' + pad2(now.getMinutes()),
      aid: a.id, name: a.name, ico: a.ico || 'star', cat: a.cat, type: t.type || 'weight' };
    if (it.type === 'cardio'){
      const m = CARDIO_MODES[t.mode] || {};
      it.mode = t.mode; it.level = t.level ?? 1; it.speed = t.speed; it.slope = t.slope;
      it.durMin = num(t.durMin, 30);

    } else {
      it.setList = (t.setList || [{ w: 0, r: 10 }]).map(s => ({ w: num(s.w, 0), r: num(s.r, 10), done: 0 }));
      it.intensity = t.intensity || 'mid'; it.restSec = num(t.restSec, 90); it.workSec = num(t.workSec, 40);
    }
    const pp = profileAt(date);
    const r = it.type === 'cardio' ? cardioEst(it, pp) : strengthEst(a, it, pp);
    it.met = +r.met.toFixed(2); it.durMin = +r.min.toFixed(1);
    it.kcal = Math.round(r.gross); it.kcalNet = Math.round(r.net); it.mv = 2;
    return it;
  });
  (recs[date] = recs[date] || []).push(...added);
  Store.set('records', recs);
  refreshAll();
  switchTab('record');
  toast(`已套用「${tpl.name}」，${added.length} 项`, () => {
    const r = Store.records();
    r[date] = (r[date] || []).filter(x => !added.some(c => c.id === x.id));
    if (!r[date].length) delete r[date];
    Store.set('records', r); refreshAll(); hideToast();
  });
}

/* ================= 图表工具 ================= */
function lineChartSVG(pts, opt){
  const W = 300, H = opt.h || 86, pad = 8;
  if (pts.length < 2) return '';
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const span = y1 - y0 || Math.max(1, y1 * 0.1);
  y0 -= span * 0.15; y1 += span * 0.15;
  const px = v => pad + (x1 === x0 ? (W - 2 * pad) / 2 : (v - x0) / (x1 - x0) * (W - 2 * pad));
  const py = v => H - pad - (v - y0) / (y1 - y0) * (H - 2 * pad);
  const d = pts.map(p => `${px(p.x).toFixed(1)},${py(p.y).toFixed(1)}`).join(' ');
  const area = `${px(x0).toFixed(1)},${(H - pad).toFixed(1)} ${d} ${px(x1).toFixed(1)},${(H - pad).toFixed(1)}`;
  const color = opt.color || 'var(--accent)';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible" role="img" aria-label="${esc(opt.label || '趋势图')}">
    <polygon points="${area}" fill="${color}" opacity=".10"/>
    <polyline points="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="2.4" fill="${color}"/>`).join('')}
  </svg>`;
}

/* ================= 统计页 ================= */
function renderStats(){
  const page = $('#page-stats');
  const recs = Store.records();
  const N = state.histDays, net = useNet();
  const days = [];
  for (let i = N - 1; i >= 0; i--){
    const key = shiftDate(todayStr(), -i);
    const items = recs[key] || [];
    days.push({ key, items, kcal: dayKcal(items, net), vol: dayVol(items), count: items.length, min: dayMin(items) });
  }
  const totKcal = days.reduce((s, d) => s + d.kcal, 0);
  const totVol = days.reduce((s, d) => s + d.vol, 0);
  const totMin = days.reduce((s, d) => s + d.min, 0);
  const trainDays = days.filter(d => d.count > 0).length;
  const isVol = state.chartMode === 'vol';
  const vals = days.map(d => isVol ? d.vol : d.kcal);
  const maxV = Math.max(...vals, 1);
  const step = N > 14 ? Math.ceil(N / 6) : 1;
  const bars = days.map((d, i) => `
    <div class="bar-wrap">
      <span class="bar-val">${vals[i] ? (isVol ? Math.round(vals[i] / 100) / 10 + 't' : Math.round(vals[i])) : ''}</span>
      <div class="bar ${vals[i] ? '' : 'zero'}" style="height:${vals[i] ? Math.max(8, vals[i] / maxV * 92) : 3}px"></div>
      <span class="bar-label">${(i % step === 0 || i === N - 1) ? fmtDateShort(d.key) : ''}</span>
    </div>`).join('');

  /* 部位分布（按组数） */
  const partSets = {};
  days.forEach(d => d.items.forEach(it => {
    const n = it.type === 'cardio' ? 0 : (it.setList || []).length;
    const k = catName(it.cat);
    partSets[k] = (partSets[k] || 0) + (n || (it.type === 'cardio' ? 1 : 0));
  }));
  const parts = Object.entries(partSets).filter(e => e[1]).sort((a, b) => b[1] - a[1]);
  const maxP = Math.max(...parts.map(p => p[1]), 1);
  const partHTML = parts.length ? parts.map(p => `
    <div class="part-row"><span class="pn">${esc(p[0])}</span>
      <div class="part-bar"><i style="width:${p[1] / maxP * 100}%"></i></div>
      <span class="pv">${p[1]} 组</span></div>`).join('')
    : `<div class="empty" style="padding:20px 0">近 ${N} 天还没有训练</div>`;

  page.innerHTML = `
    <div class="page-title">训练统计
      <div class="seg mini" id="rangeSeg">
        ${[7, 30, 90].map(n => `<button data-d="${n}" class="${N === n ? 'on' : ''}">${n}天</button>`).join('')}
      </div>
    </div>
    ${streakHTML()}
    <div class="stats-grid">
      <div class="stat-card"><div class="n g">${trainDays}<span style="font-size:12px;color:var(--sub)"> / ${N}天</span></div><div class="l">训练天数</div></div>
      <div class="stat-card"><div class="n">${Math.round(totKcal)}</div><div class="l">${net ? '净消耗' : '总消耗'} kcal</div></div>
      <div class="stat-card"><div class="n">${fmtHM(totMin)}</div><div class="l">训练时长</div></div>
      <div class="stat-card"><div class="n">${fmtVol(totVol)}</div><div class="l">总训练容量</div></div>
    </div>
    <div class="chart-card">
      <div class="chart-head"><span class="t">每日${isVol ? '训练容量' : '热量消耗'}</span>
        <div class="seg mini" id="chartModeSeg">
          <button data-m="kcal" class="${isVol ? '' : 'on'}">热量</button>
          <button data-m="vol" class="${isVol ? 'on' : ''}">容量</button>
        </div>
      </div>
      <div class="bars">${bars}</div>
    </div>
    <div class="chart-card"><div class="t" style="margin-bottom:12px">近 ${N} 天部位分布</div>${partHTML}</div>
    ${balanceHTML()}
    ${trendHTML()}
    ${prHTML()}
    ${weightTrendHTML()}`;
}
function streakHTML(){
  const recs = Store.records();
  let streak = 0;
  let d = todayStr();
  if (!(recs[d] || []).length) d = shiftDate(d, -1);
  while ((recs[d] || []).length){ streak++; d = shiftDate(d, -1); }
  const week = [];
  for (let i = 6; i >= 0; i--){ const k = shiftDate(todayStr(), -i); week.push((recs[k] || []).length > 0); }
  const cnt = week.filter(Boolean).length;
  return `<div class="streak-card">
    ${ico('flame')}
    <div><div class="streak-n">${streak} 天</div><div class="streak-l">连续训练${streak ? '' : '（今天还没练）'} · 最近 7 天练了 ${cnt} 次</div></div>
    <div class="dots-week">${week.map(b => `<i class="${b ? 'on' : ''}"></i>`).join('')}</div>
  </div>`;
}
function balanceHTML(){
  const recs = Store.records();
  const last = {};
  Object.keys(recs).forEach(d => (recs[d] || []).forEach(it => {
    if (!last[it.cat] || d > last[it.cat]) last[it.cat] = d;
  }));
  const rows = CATS.filter(c => c.id !== 'cardio').map(c => {
    const d = last[c.id];
    const n = d ? daysBetween(d, todayStr()) : null;
    const cls = n === null ? 'bad' : n <= 4 ? 'ok' : n <= 8 ? 'warn' : 'bad';
    const txt = n === null ? '从未练过' : n === 0 ? '今天练过' : `${n} 天前`;
    return { c, n: n === null ? 999 : n, cls, txt };
  }).sort((a, b) => b.n - a.n);
  const stale = rows.filter(r => r.n > 8);
  return `<div class="chart-card">
    <div class="t" style="margin-bottom:12px">部位平衡 · 距上次训练</div>
    ${rows.map(r => `<div class="balance-row">
      <span class="bn">${r.c.name}</span>
      <span class="bd">${r.n <= 4 ? '状态不错' : r.n <= 8 ? '可以安排了' : '太久没练'}</span>
      <span class="bt ${r.cls}">${r.txt}</span></div>`).join('')}
    ${stale.length ? `<div class="note-line">建议优先安排：<b>${stale.slice(0, 3).map(r => r.c.name).join('、')}</b></div>` : ''}
  </div>`;
}
function trendHTML(){
  const recs = Store.records();
  const byAid = {};
  Object.keys(recs).forEach(date => (recs[date] || []).forEach(it => {
    if (it.type === 'cardio') return;
    (byAid[it.aid] = byAid[it.aid] || []).push({ date, it });
  }));
  const aids = Object.keys(byAid).filter(a => {
    const ds = new Set(byAid[a].map(x => x.date));
    return ds.size >= 2;
  }).sort((a, b) => byAid[b].length - byAid[a].length);
  if (!aids.length)
    return `<div class="chart-card"><div class="t">单动作进步曲线</div>
      <div class="empty" style="padding:20px 0">同一个动作记录满 2 天后<br>这里会显示重量变化</div></div>`;
  if (!state.trendAid || !aids.includes(state.trendAid)) state.trendAid = aids[0];
  const list = byAid[state.trendAid];
  const byDate = {};
  list.forEach(x => {
    const k = x.date;
    byDate[k] = byDate[k] || { maxW: 0, vol: 0 };
    byDate[k].maxW = Math.max(byDate[k].maxW, maxWOf(x.it));
    byDate[k].vol += volOf(x.it);
  });
  const dates = Object.keys(byDate).sort();
  const base = dates[0];
  const useW = dates.some(d => byDate[d].maxW > 0);
  const pts = dates.map(d => ({ x: daysBetween(base, d), y: useW ? byDate[d].maxW : byDate[d].vol }));
  const first = pts[0].y, lastv = pts[pts.length - 1].y;
  const diff = lastv - first;
  const name = (getAction(state.trendAid) || { name: list[0].it.name }).name;
  return `<div class="chart-card">
    <div class="chart-head"><span class="t">单动作进步曲线</span></div>
    <div class="pick-wrap" style="margin-bottom:12px">
      <select class="pick" id="trendPick" aria-label="选择动作">
        ${aids.map(a => `<option value="${a}" ${a === state.trendAid ? 'selected' : ''}>${esc((getAction(a) || byAid[a][0].it).name)}（${new Set(byAid[a].map(x => x.date)).size}次）</option>`).join('')}
      </select>${ico('chevron')}
    </div>
    ${lineChartSVG(pts, { color: 'var(--accent)', label: name + '趋势' })}
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:8px">
      <span>${fmtDateShort(dates[0])} · ${useW ? fmtKg(first) + 'kg' : fmtVol(first)}</span>
      <span style="color:${diff >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:700">
        ${diff >= 0 ? '+' : ''}${useW ? fmtKg(diff) + 'kg' : fmtVol(Math.abs(diff))}</span>
      <span>${fmtDateShort(dates[dates.length - 1])} · ${useW ? fmtKg(lastv) + 'kg' : fmtVol(lastv)}</span>
    </div>
    <div class="note-line">显示${useW ? '每次训练的最大重量' : '每次训练的总容量'}。想看别的动作，用上面的下拉框切换。</div>
  </div>`;
}
function prHTML(){
  const recs = Store.records();
  const best = {};
  Object.keys(recs).forEach(date => (recs[date] || []).forEach(it => {
    if (it.type === 'cardio') return;
    const w = maxWOf(it);
    if (!w) return;
    if (!best[it.aid] || w > best[it.aid].w) best[it.aid] = { w, date, name: it.name, ico: it.ico, reps: (it.setList || []).filter(s => s.w === w).reduce((m, s) => Math.max(m, s.r), 0) };
  }));
  const list = Object.values(best).sort((a, b) => b.w - a.w).slice(0, 8);
  if (!list.length) return '';
  return `<div class="chart-card">
    <div class="t" style="margin-bottom:12px">个人纪录 · 最大重量</div>
    ${list.map(b => `<div class="pr-row">${ico(b.ico || 'star')}
      <span class="pn">${esc(b.name)}</span>
      <span class="pv">${fmtKg(b.w)}kg × ${b.reps}</span>
      <span class="pd">${fmtDateShort(b.date)}</span></div>`).join('')}
  </div>`;
}
function weightTrendHTML(){
  const ws = Store.weights().filter(w => w && w.weight && w.date).sort((a, b) => a.date < b.date ? -1 : 1);
  const head = `<div class="chart-head"><span class="t">体重趋势</span>
    <button class="mini-btn" id="statsAddWeightBtn">${ico('plus')}记一笔</button></div>`;
  if (ws.length < 2)
    return `<div class="chart-card">${head}<div class="empty" style="padding:18px 0">记满两次体重后<br>这里会按真实日期画出曲线</div></div>`;
  const recent = ws.slice(-40);
  const base = recent[0].date;
  const pts = recent.map(w => ({ x: daysBetween(base, w.date), y: w.weight }));
  const first = recent[0], last = recent[recent.length - 1];
  const diff = last.weight - first.weight;
  return `<div class="chart-card">${head}
    ${lineChartSVG(pts, { color: 'var(--blue)', label: '体重趋势' })}
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:8px">
      <span>${fmtDateShort(first.date)} · ${first.weight}kg</span>
      <span style="color:${diff > 0 ? 'var(--red)' : diff < 0 ? 'var(--green)' : 'var(--dim)'};font-weight:700">
        ${diff > 0 ? '+' : ''}${diff.toFixed(1)}kg</span>
      <span>${fmtDateShort(last.date)} · ${last.weight}kg</span>
    </div>
  </div>`;
}

function recordWeight(v){

  const p = Store.profile();
  p.weight = v;
  Store.set('profile', p);
}

function exportData(){
  const data = Store.snapshot();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '健身记录备份_' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  const meta = Store.meta();
  meta.lastBackup = todayStr();
  Store.set('meta', meta);
  renderProfile();
  toast('备份已导出');
}
function mergeRecords(oldR, newR){
  const out = clone(oldR);
  Object.keys(newR || {}).forEach(date => {
    const list = Array.isArray(newR[date]) ? newR[date] : [];
    if (!out[date]) { out[date] = list; return; }
    const seen = new Set(out[date].map(x => x.id + '|' + x.aid + '|' + x.time));
    list.forEach(x => { if (!seen.has(x.id + '|' + x.aid + '|' + x.time)) out[date].push(x); });
  });
  return out;
}
function doImport(data, mode){
  const before = Store.snapshot();
  try { localStorage.setItem('fit_preimport', JSON.stringify(before)); } catch (e) {}
  if (mode === 'merge'){
    Store.set('records', mergeRecords(Store.records(), data.records));
    const cu = Store.custom();
    (data.custom || []).forEach(c => { if (!cu.some(x => x.id === c.id || x.name === c.name)) cu.push(c); });
    Store.set('custom', cu);
    const ws = Store.weights();
    (data.weights || []).forEach(w => { if (!ws.some(x => x.date === w.date)) ws.push(w); });
    Store.set('weights', ws.sort((a, b) => a.date < b.date ? -1 : 1));
    const tp = Store.templates();
    (data.templates || []).forEach(t => { if (!tp.some(x => x.id === t.id)) tp.push(t); });
    Store.set('templates', tp);
  } else {
    Store.set('records', data.records || {});
    Store.set('custom', data.custom || []);
    Store.set('weights', data.weights || []);
    Store.set('templates', data.templates || []);
    if (data.profile) Store.set('profile', data.profile);
    if (data.settings) Store.set('settings', { ...DEFAULTS.settings, ...data.settings });
  }
  const meta = Store.meta();
  meta.schema = 0;
  Store.set('meta', meta);
  migrate();
  invalidateActions();
  applyTheme();
  renderProfile(); refreshAll();
  toast(mode === 'merge' ? '已合并导入' : '已覆盖导入', () => {
    try {
      const raw = localStorage.getItem('fit_preimport');
      if (!raw) return;
      const b = JSON.parse(raw);
      ['records', 'custom', 'weights', 'templates', 'profile', 'settings'].forEach(k => { if (b[k] !== undefined) Store.set(k, b[k]); });
      invalidateActions(); applyTheme(); renderProfile(); refreshAll(); hideToast();
      toast('已还原到导入前');
    } catch (e) {}
  });
}
function askImport(data){
  const days = Object.keys(data.records || {}).length;
  openModal(`<div class="modal-title">导入备份</div>
    <div class="modal-text">文件里有 <b>${days}</b> 天训练记录${data.exportedAt ? '，导出于 ' + data.exportedAt.slice(0, 10) : ''}。<br><br>
      <b>合并</b>：保留现有记录，只补充缺少的内容（推荐）。<br>
      <b>覆盖</b>：删除本机现有记录，完全替换成文件里的内容。</div>
    <div class="modal-row">
      <button class="btn-save secondary" data-mo="cancel">取消</button>
      <button class="btn-save secondary" data-mo="replace">覆盖</button>
      <button class="btn-save" data-mo="merge">合并</button></div>`);
  const m = $('#modal');
  m.querySelector('[data-mo="cancel"]').onclick = closeModal;
  m.querySelector('[data-mo="merge"]').onclick = () => { closeModal(); doImport(data, 'merge'); };
  m.querySelector('[data-mo="replace"]').onclick = () => { closeModal(); doImport(data, 'replace'); };
}
function clearAll(){
  confirmBox('清空全部数据',
    '训练记录、体重记录、自定义动作、模板和个人设置都会被删除，<b>无法恢复</b>。建议先导出一份备份。',
    '确认清空', () => {
      ['profile', 'records', 'custom', 'weights', 'templates', 'settings', 'meta', 'preimport'].forEach(k => {
        localStorage.removeItem('fit_' + k);
        delete cache[k];
        IDB.mirror(k, null);
      });
      invalidateActions();
      applyTheme();
      state.date = todayStr(); state.dateTouched = false;
      applyDateUI(); renderCats(); renderProfile(); refreshAll();
      toast('全部数据已清空');
    }, true);
}

<script>
"use strict";
/* ================= 页面切换 ================= */
function switchTab(name){
  $$('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
  const p = document.querySelector('.page.active');
  if (p) p.scrollTop = 0;
  if (name === 'history'){ state.histPage = 1; renderHistory(); }
  if (name === 'stats') renderStats();
  if (name === 'profile') renderProfile();

/* ================= 删除（带撤销） ================= */
function deleteRecord(date, idx){
  const recs = Store.records();
  const items = recs[date];
  if (!items || !items[idx]) return;
  const [removed] = items.splice(idx, 1);
  if (!items.length) delete recs[date];
  Store.set('records', recs);
  refreshAll();
  toast(`已删除 ${removed.name}`, () => {
    const r = Store.records();
    const list = r[date] = r[date] || [];
    list.splice(Math.min(idx, list.length), 0, removed);
    Store.set('records', r);
    refreshAll();
    hideToast();
    toast('已撤销删除');
  });
}
function openEdit(date, idx){
  const it = (Store.records()[date] || [])[idx];
  if (!it) return;
  const meta = getAction(it.aid) || {
    id: it.aid, name: it.name, ico: it.ico || 'star', cat: it.cat, type: it.type,
    mode: it.mode, met: num(it.met, 4.5), c: 0, load: 'bar', compound: 0,
  };
  openDrawer(meta, it, { date, idx });
}

/* ================= 全局事件 ================= */
function bindGlobalEvents(){
  $$('.tab').forEach(tab => tab.onclick = () => switchTab(tab.dataset.tab));
  $('#kcalBadge').onclick = () => switchTab('stats');

  /* 日期 */
  $('#dbDateInput').addEventListener('change', e => {
    if (!e.target.value) return;
    state.date = e.target.value;
    state.dateTouched = state.date !== todayStr();
    applyDateUI(); renderTodayList();
  });
  $('#dbToday').onclick = () => {
    state.date = todayStr(); state.dateTouched = false;
    applyDateUI(); renderTodayList();
  };

  /* 搜索 */
  const si = $('#searchInput');
  si.addEventListener('input', () => {
    state.q = si.value;
    $('#searchBar').classList.toggle('has-val', !!si.value);
    renderActions();
  });
  $('#searchClear').onclick = () => { si.value = ''; state.q = ''; $('#searchBar').classList.remove('has-val'); renderActions(); si.focus(); };

  /* 分类 */
  $('#catScroll').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    state.cat = chip.dataset.cat;
    renderCats(); renderActions();
  });

  /* 动作网格 */
  $('#actionGrid').addEventListener('click', e => {
    const add = e.target.closest('[data-add]');
    if (add){
      switchTab('profile');
      setTimeout(() => { const i = $('#customName'); if (i){ i.scrollIntoView({ block: 'center' }); i.focus(); } }, 320);
      return;
    }
    const card = e.target.closest('.act-card');
    if (!card) return;
    const a = getAction(card.dataset.aid);
    if (a) openDrawer(a);
  });

  /* 今日列表 + 历史页：编辑 / 删除 */
  const listClick = e => {
    const del = e.target.closest('[data-del]');
    if (del){
      const [date, idx] = del.dataset.del.split('|');
      deleteRecord(date, +idx);
      return true;
    }
    const row = e.target.closest('[data-edit]');
    if (row){
      const [date, idx] = row.dataset.edit.split('|');
      openEdit(date, +idx);
      return true;
    }
    return false;
  };
  $('#todayList').addEventListener('click', listClick);
  $('#page-history').addEventListener('click', e => {
    if (listClick(e)) return;
    const cd = e.target.closest('[data-copyday]');
    if (cd){ copyDayToToday(cd.dataset.copyday); return; }
    const tp = e.target.closest('[data-tpl]');
    if (tp){ saveDayAsTemplate(tp.dataset.tpl); return; }
    const more = e.target.closest('[data-more]');
    if (more){ state.histPage++; renderHistory(); return; }
  });

  /* 统计页 */
  $('#page-stats').addEventListener('click', e => {
    const r = e.target.closest('#rangeSeg button');
    if (r){ state.histDays = +r.dataset.d; renderStats(); return; }
    const m = e.target.closest('#chartModeSeg button');
    if (m){ state.chartMode = m.dataset.m; renderStats(); return; }
    if (e.target.closest('#statsAddWeightBtn')){ openWeightModal(); return; }
  });
  $('#page-stats').addEventListener('change', e => {
    if (e.target.id === 'trendPick'){ state.trendAid = e.target.value; renderStats(); }
  });

  /* 我的 */
  $('#page-profile').addEventListener('click', e => {
    const t = e.target;
    const segPick = (sel, btn) => { $(sel).querySelectorAll('button').forEach(x => x.classList.remove('on')); btn.classList.add('on'); };

    const g = t.closest('#genderSeg button');
    if (g){ segPick('#genderSeg', g); const p = Store.profile(); p.gender = g.dataset.g; Store.set('profile', p); return; }

    const dl = t.closest('#defLevelSeg button');
    if (dl){ segPick('#defLevelSeg', dl); const s = S(); s.defaultLevel = dl.dataset.lv; Store.set('settings', s); return; }

    const ns = t.closest('#netSeg button');
    if (ns){ segPick('#netSeg', ns); const s = S(); s.netKcal = ns.dataset.n === '1'; Store.set('settings', s); updateTopKcal(); renderTodayList(); return; }

    const ar = t.closest('#autoRestSeg button');
    if (ar){ segPick('#autoRestSeg', ar); const s = S(); s.autoRest = ar.dataset.v === '1'; Store.set('settings', s); return; }

    const so = t.closest('#soundSeg button');
    if (so){ segPick('#soundSeg', so); const s = S(); s.sound = so.dataset.v === '1'; Store.set('settings', s); if (s.sound) notifyDone(); return; }

    const th = t.closest('#themeSeg button');
    if (th){ segPick('#themeSeg', th); const s = S(); s.theme = th.dataset.th; Store.set('settings', s); applyTheme(); return; }

    if (t.closest('#saveProfileBtn')){
      const h = num($('#inHeight').value, 0), w = num($('#inWeight').value, 0), a = num($('#inAge').value, 0);
      if (h < 80 || h > 250){ toast('身高请填 80~250 cm'); return; }
      if (w < 25 || w > 300){ toast('体重请填 25~300 kg'); return; }
      const p = Store.profile();
      const changed = Math.abs(num(p.weight, 0) - w) > 0.05;
      p.height = h;
      if (a > 10 && a < 100) p.age = a;
      Store.set('profile', p);
      if (changed) recordWeight(Math.round(w * 10) / 10); else { p.weight = w; Store.set('profile', p); }
      renderProfile();
      toast(changed ? '已保存，并记了一条体重' : '身体数据已保存');
      return;
    }
    if (t.closest('#saveSettingsBtn')){
      const s = S();
      s.defaultRest = clamp(Math.round(num($('#inRest').value, 90)), 15, 300);
      s.defaultWork = clamp(Math.round(num($('#inWork').value, 40)), 10, 180);
      Store.set('settings', s);
      renderProfile();
      toast('设置已保存');
      return;
    }
    if (t.closest('#addWeightBtn')){ openWeightModal(); return; }

    const wd = t.closest('[data-wdel]');
    if (wd){
      const date = wd.dataset.wdel;
      const ws = Store.weights();
      const i = ws.findIndex(x => x.date === date);
      if (i < 0) return;
      const [rm] = ws.splice(i, 1);
      Store.set('weights', ws);
      renderProfile();
      toast('已删除体重记录', () => {
        const w2 = Store.weights(); w2.push(rm);
        Store.set('weights', w2.sort((a, b) => a.date < b.date ? -1 : 1));
        renderProfile(); hideToast();
      });
      return;
    }

    const ta = t.closest('[data-tplapply]');
    if (ta){ applyTemplate(ta.dataset.tplapply); return; }
    const td = t.closest('[data-tpldel]');
    if (td){
      const tpls = Store.templates();
      const i = tpls.findIndex(x => x.id === td.dataset.tpldel);
      if (i < 0) return;
      const [rm] = tpls.splice(i, 1);
      Store.set('templates', tpls);
      renderProfile();
      toast(`已删除模板「${rm.name}」`, () => {
        const l = Store.templates(); l.push(rm); Store.set('templates', l); renderProfile(); hideToast();
      });
      return;
    }

    /* 自定义动作 */
    const ct = t.closest('#customTypeSeg button');
    if (ct){ state.customDraft.type = ct.dataset.t; if (ct.dataset.t === 'cardio' && !state.customDraft.mode) state.customDraft.mode = 'hiit'; readCustomForm(); $('#customForm').innerHTML = customFormHTML(); return; }
    const cc = t.closest('#customCatSeg button');
    if (cc){ segPick('#customCatSeg', cc); state.customDraft.cat = cc.dataset.c; return; }
    const ci = t.closest('#customIcons button');
    if (ci){ segPick('#customIcons', ci); state.customDraft.ico = ci.dataset.ico; return; }
    if (t.closest('#customCancel')){ state.editingCustom = null; state.customDraft = { cat: 'chest', ico: 'star', type: 'weight' }; refreshCustomUI(); return; }
    if (t.closest('#customSave')){ saveCustom(); return; }
    const ce = t.closest('[data-cedit]');
    if (ce){
      const c = Store.custom().find(x => x.id === ce.dataset.cedit);
      if (!c) return;
      state.editingCustom = c.id;
      state.customDraft = { ...c };
      $('#customForm').innerHTML = customFormHTML();
      $('#customForm').scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
    const cd = t.closest('[data-cdel]');
    if (cd){
      const c = Store.custom().find(x => x.id === cd.dataset.cdel);
      if (!c) return;
      confirmBox('删除自定义动作', `确定删除「${esc(c.name)}」？已经记录的历史不会受影响。`, '删除', () => {
        Store.set('custom', Store.custom().filter(x => x.id !== c.id));
        if (state.editingCustom === c.id){ state.editingCustom = null; state.customDraft = { cat: 'chest', ico: 'star', type: 'weight' }; }
        refreshCustomUI();
        renderProfile();
        toast('已删除');
      }, true);
      return;
    }

    if (t.closest('#exportBtn')){ exportData(); return; }
    if (t.closest('#importBtn')){ $('#importFile').click(); return; }
    if (t.closest('#clearBtn')){ clearAll(); return; }
  });
  $('#page-profile').addEventListener('change', e => {
    if (e.target.id === 'customMode') state.customDraft.mode = e.target.value;
    if (e.target.id === 'customRef'){
      state.customDraft.refId = e.target.value;
      const box = $('#cmBox'); if (box) box.outerHTML = customMatchHTML(state.customDraft);
    }
    if (e.target.id === 'customName'){
      state.customDraft.name = e.target.value;
      clearTimeout(window._cmT);
      window._cmT = setTimeout(() => {
        const box = $('#cmBox');
        if (box){ state.customDraft.refId = ''; box.outerHTML = customMatchHTML(state.customDraft); }
      }, 350);
    }
    if (e.target.id !== 'importFile') return;
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== 'object' || typeof data.records !== 'object') throw new Error('bad');
        askImport(data);
      } catch (err) { toast('这个文件不是本应用导出的备份'); }
    };
    reader.onerror = () => toast('文件读取失败');
    reader.readAsText(file);
  });

  /* 抽屉 / 弹层 / 计时器 */
  $('#drawerClose').onclick = closeDrawer;
  $('#drawerMask').onclick = closeDrawer;
  $('#modalMask').onclick = closeModal;
  $('#restStop').onclick = () => Rest.stop();
  $('#restPlus').onclick = () => Rest.add(30);
  $('#toast').querySelector('.undo').onclick = () => { if (_undoFn) _undoFn(); };
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#modal').classList.contains('show')) closeModal();
    else if ($('#drawer').classList.contains('show')) closeDrawer();
  });
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S().theme === 'auto') applyTheme(); });
}
function readCustomForm(){
  const n = $('#customName'), s = $('#customStd'), m = $('#customMode'), r = $('#customRef');
  if (n) state.customDraft.name = n.value;
  if (s) state.customDraft._std = num(s.value, 0);
  if (m) state.customDraft.mode = m.value;
  if (r) state.customDraft.refId = r.value || '';
}
function saveCustom(){
  readCustomForm();
  const d = state.customDraft;
  const name = (d.name || '').trim();
  if (!name){ toast('请填写动作名称'); return; }
  const dup = Store.custom().some(c => c.name === name && c.id !== state.editingCustom)
    || BUILTIN.some(b => b.name === name);
  if (dup){ toast('已经有同名动作了'); return; }
  const p = Store.profile();
  const custom = Store.custom();
  const obj = {
    id: state.editingCustom || ('c_' + Date.now()),
    cat: d.cat || 'chest', name, ico: d.ico || 'star',
    type: d.type === 'cardio' ? 'cardio' : 'weight',
    compound: 0, custom: 1,
  };
  if (obj.type === 'cardio'){
    obj.mode = d.mode || 'hiit';
    obj.met = (CARDIO_MODES[obj.mode].levels || [6])[1] || 6;
    obj.load = 'bar';
  } else {
    const R = resolveCustomPhys(d);
    if (R){
      obj.phys = R.phys; obj.load = R.load; obj.compound = R.compound; obj.refId = R.refId;
      obj.c = d._std > 0 ? +(d._std / (p.weight || 70)).toFixed(3) : R.c;
    } else {
      // 识别不出又没选参照：保守取上肢复合 + 中等行程，并明确标记
      obj.phys = { rom:0.40, tier:'compound_upper', bw:0, lever:1,
                   loadType:'bar', hold:false, fallback:1 };
      obj.load = 'bar';
      obj.c = d._std > 0 ? +(d._std / (p.weight || 70)).toFixed(3) : 0;
    }
  }
  const i = custom.findIndex(c => c.id === obj.id);
  if (i >= 0) custom[i] = obj; else custom.push(obj);
  Store.set('custom', custom);
  state.editingCustom = null;
  state.customDraft = { cat: obj.cat, ico: 'star', type: 'weight' };
  invalidateActions();
  renderProfile();
  toast(i >= 0 ? '已保存修改' : `已添加「${name}」`);
}

/* ================= 跨天翻转 ================= */
let _lastDay = todayStr();
function checkDayFlip(){
  const t = todayStr();
  if (t === _lastDay){ if (Rest.id) Rest.tick(); return; }
  _lastDay = t;
  if (!state.dateTouched){
    state.date = t;
    applyDateUI();
  }
  refreshAll();
}

/* ================= PWA manifest ================= */
function injectManifest(){
  try {
    const icon = encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#0d0f14"/><g fill="none" stroke="#ff8c2b" stroke-width="12" stroke-linecap="round"><path d="M28 96h136"/><rect x="40" y="64" width="20" height="64" rx="9"/><rect x="132" y="64" width="20" height="64" rx="9"/><path d="M74 76v40M118 76v40"/></g></svg>`);
    const manifest = {
      name: '我的健身记录', short_name: '健身记录', start_url: '.', display: 'standalone',
      background_color: '#0d0f14', theme_color: '#0d0f14', lang: 'zh-CN',
      icons: [{ src: 'data:image/svg+xml,' + icon, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }],
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  } catch (e) {}
}

/* ================= 启动 ================= */
async function init(){
  await IDB.open();
  const restored = await IDB.restoreIfEmpty();
  if (restored) Object.keys(cache).forEach(k => delete cache[k]);
  migrate();
  applyTheme();
  injectManifest();
  state.date = todayStr();
  state.customDraft.cat = 'chest';
  applyDateUI();
  renderCats();
  renderActions();
  renderTodayList();
  updateTopKcal();
  bindGlobalEvents();
  setInterval(checkDayFlip, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDayFlip(); });
  window.addEventListener('focus', checkDayFlip);
  if (restored) setTimeout(() => toast('浏览器清理过数据，已从本地副本恢复'), 700);
  else if (localStorage.getItem('fit_profile') === null)
    setTimeout(() => toast('第一次使用：先到「我的」填身高体重'), 900);
  else {
    const meta = Store.meta();
    const days = meta.lastBackup ? daysBetween(meta.lastBackup, todayStr()) : 999;
    if (days > 21 && Object.keys(Store.records()).length > 3)
      setTimeout(() => toast('很久没备份了，建议到「我的」导出一份'), 1200);
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
